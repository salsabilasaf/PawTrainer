<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Tutorial — PawTrainer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="api.js"></script>
<script>Auth.requireAuth();</script>
<script src="navbar.js"></script>
<script>renderNavbar('tutorials');</script>

<main class="page">
    <a href="tutorials.html" class="back-link">← Kembali ke Tutorial</a>

    <!-- Loading state -->
    <div id="loadingState">
        <div class="skeleton skeleton-line" style="height:36px;width:70%;margin-bottom:16px;"></div>
        <div class="skeleton skeleton-line" style="height:320px;border-radius:16px;margin-bottom:24px;"></div>
        <div class="skeleton skeleton-line" style="height:16px;width:100%;margin-bottom:10px;"></div>
        <div class="skeleton skeleton-line" style="height:16px;width:90%;margin-bottom:10px;"></div>
        <div class="skeleton skeleton-line" style="height:16px;width:80%;"></div>
    </div>

    <!-- Error state -->
    <div id="errorState" class="empty-state" style="display:none;">
        
        <div class="empty-state__title">Tutorial tidak ditemukan</div>
        <p class="empty-state__text" id="errorMsg">Terjadi kesalahan saat memuat tutorial.</p>
        <a href="tutorials.html" class="btn btn--primary" style="margin-top:1rem;">Kembali</a>
    </div>

    <!-- Tutorial content -->
    <div id="tutorialContent" style="display:none;">
        <div class="tutorial-detail">
            <!-- Main Column -->
            <div>
                <div class="tutorial-detail__meta" id="tutMeta"></div>
                <h1 class="tutorial-detail__title" id="tutTitle"></h1>
                <div class="tutorial-detail__content" id="tutContent"></div>

                <!-- Image -->
                <div id="tutImgWrap"></div>

                <!-- YouTube -->
                <div id="tutVideo"></div>

<div id="relatedVideos"></div>

                

                <!-- Comments -->
                <div class="section-header" style="margin-top:2rem;">
                    <h2>Komentar</h2>
                </div>

                <!-- Add Comment -->
                <div class="sidebar-box" style="margin-bottom:1.5rem;">
                    <h3>Tulis Komentar</h3>
                    <div class="form-group" style="margin-bottom:0.75rem;">
                        <textarea id="commentInput" placeholder="Tulis komentar kamu di sini..." rows="3"></textarea>
                    </div>
                    <button class="btn btn--primary" id="submitComment">Kirim Komentar</button>
                </div>

                <div id="commentsContainer">
                    <div class="skeleton skeleton-line" style="height:70px;border-radius:10px;"></div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar-box" id="actionBox">
    <h3>Aksi</h3>

    <button
        id="favoriteBtn"
        class="btn btn--outline btn--full">
        Tambah ke Favorit
    </button>
</div>

                <div class="sidebar-box">
                    <h3>Info Tutorial</h3>
                    <div id="tutInfo" style="display:flex;flex-direction:column;gap:0.6rem;font-size:0.875rem;color:var(--text-secondary);"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const params     = new URLSearchParams(window.location.search);
    const tutId      = params.get('id');
    let isFavorite   = false;
    let favorites    = [];

    if (!tutId) window.location.href = 'tutorials.html';

    async function loadTutorial() {
        try {
            // Load tutorial & favorites in parallel
            const [tutRes, favRes] = await Promise.allSettled([
                TutorialAPI.getById(tutId),
                FavoriteAPI.getAll()
            ]);

            if (tutRes.status === 'rejected') throw tutRes.reason;

            const tutorial = unwrapData(tutRes.value).tutorial;
            favorites = favRes.status === 'fulfilled'
                ? (unwrapData(favRes.value).favorites || [])
                : [];
            isFavorite = favorites.some(f => String(f.tutorial_id || f.id) === String(tutId));

            renderTutorial(tutorial);
            loadComments();
        } catch (err) {
            document.getElementById('loadingState').style.display  = 'none';
            document.getElementById('errorState').style.display    = 'flex';
            document.getElementById('tutorialContent').style.display = 'none';
            document.getElementById('errorMsg').textContent = UI.parseError(err);
        }
    }

    function renderTutorial(t) {
        document.title = `${t.title} — PawTrainer`;

        // Meta
        document.getElementById('tutMeta').innerHTML = `
            ${UI.difficultyBadge(t.difficulty)}
            <span>${t.estimated_time} menit</span>
            <span>${t.category?.name || '—'}</span>
            <span>${UI.formatDate(t.created_at)}</span>
            <span>${t.comments_count || 0} komentar</span>
            <span>${t.favorites_count || 0} favorit</span>`;

        document.getElementById('tutTitle').textContent = t.title;

        // Image
        if (t.image_url) {
            document.getElementById('tutImgWrap').innerHTML =
                `<img src="${t.image_url}" alt="${t.title}"
                    style="width:100%;max-height:360px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:1.5rem;"
                    onerror="this.style.display='none'">`;
        }

        // YouTube
        if (t.youtube_url) {
            const match = t.youtube_url.match(/(?:v=|youtu\.be\/)([^&?/]+)/);
            if (match) {
                document.getElementById('tutVideo').innerHTML = `
                    <div class="yt-embed">
                        <iframe src="https://www.youtube.com/embed/${match[1]}"
                            allowfullscreen loading="lazy"></iframe>
                    </div>`;
            }
        }

        // Content
        document.getElementById('tutContent').textContent = t.content || '—';

        // Info
        document.getElementById('tutInfo').innerHTML = `
    <div><strong>Kategori:</strong> ${t.category?.name || '—'}</div>
    <div><strong>Komentar:</strong> ${t.comments_count || 0}</div>
    <div><strong>Favorit:</strong> ${t.favorites_count || 0}</div>
    <div><strong>Dibuat:</strong> ${UI.formatDate(t.created_at)}</div>`;

const user = Auth.getUser();

if (user?.role === 'admin') {
    document.getElementById('actionBox').style.display = 'none';
} else {
    updateFavBtn();
}

// Video terkait
loadRelatedVideos(t.title);

        document.getElementById('loadingState').style.display    = 'none';
        document.getElementById('tutorialContent').style.display = 'block';
    }

    function updateFavBtn() {
        const btn = document.getElementById('favoriteBtn');
        if (isFavorite) {
            btn.classList.add('active');
            btn.innerHTML = 'Hapus dari Favorit';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = 'Tambah ke Favorit';
        }
    }

    document.getElementById('favoriteBtn').addEventListener('click', async () => {
        const btn = document.getElementById('favoriteBtn');
        UI.setLoading(btn, true);
        try {
            const res    = await FavoriteAPI.toggle(tutId);
            const action = unwrapData(res).action;
            isFavorite   = (action === 'added');
            updateFavBtn();
            UI.showToast(isFavorite ? 'Ditambahkan ke favorit!' : 'Dihapus dari favorit', 'success');
        } catch (err) {
            UI.showToast(UI.parseError(err), 'error');
        } finally {
            UI.setLoading(btn, false);
            updateFavBtn();
        }
    });

    async function loadComments() {
        try {
            const res      = await TutorialAPI.getComments(tutId);
            const comments = unwrapData(res).comments || [];
            renderComments(comments);
        } catch (_) {
            document.getElementById('commentsContainer').innerHTML =
                `<p style="color:var(--text-muted);font-size:0.875rem;">Gagal memuat komentar.</p>`;
        }
    }

    function renderComments(comments) {
        const container = document.getElementById('commentsContainer');
        const currentUser = Auth.getUser();

        if (comments.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="padding:2rem 1rem;">
                    
                    <div class="empty-state__title">Belum ada komentar</div>
                    <p class="empty-state__text">Jadilah yang pertama berkomentar!</p>
                </div>`;
            return;
        }

        container.innerHTML = comments.map(c => {
            const initials = c.user?.name?.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) || '?';
            const canDelete = currentUser?.role === 'admin';
            return `
                <div class="comment" id="comment-${c.id}">
                    <div class="comment__avatar">${initials}</div>
                    <div class="comment__body">
                        <div class="comment__header">
                            <span class="comment__author">${c.user?.name || 'Pengguna'}</span>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                <span class="comment__time">${UI.formatDate(c.created_at)}</span>
                                ${canDelete ? `<button class="btn btn--ghost btn--sm" style="font-size:0.78rem;color:var(--soft-red);"
                                    onclick="deleteComment(${c.id})">Hapus</button>` : ''}
                            </div>
                        </div>
                        <p class="comment__text">${c.comment}</p>
                    </div>
                </div>`;
        }).join('');
    }

    document.getElementById('submitComment').addEventListener('click', async () => {
        const input = document.getElementById('commentInput');
        const text  = input.value.trim();
        const btn   = document.getElementById('submitComment');

        if (!text) {
            UI.showToast('Komentar tidak boleh kosong.', 'error');
            return;
        }

        UI.setLoading(btn, true);
        try {
            await CommentAPI.add(tutId, text);
            input.value = '';
            UI.showToast('Komentar berhasil dikirim!', 'success');
            loadComments();
        } catch (err) {
            UI.showToast(UI.parseError(err), 'error');
        } finally {
            UI.setLoading(btn, false);
        }
    });

    async function deleteComment(id) {
        if (!confirm('Hapus komentar ini?')) return;
        try {
            await CommentAPI.delete(id);
            document.getElementById(`comment-${id}`)?.remove();
            UI.showToast('Komentar dihapus.', 'success');
        } catch (err) {
            UI.showToast(UI.parseError(err), 'error');
        }
    }

    async function loadRelatedVideos(keyword) {
    try {

        const res = await ExternalAPI.getVideos(keyword);

        const videos =
            res.data.data.videos || [];

        if (!videos.length) return;

        document.getElementById('relatedVideos').innerHTML = `
            <div class="section-header" style="margin-top:2rem;">
                <h2>Video Terkait</h2>
            </div>

            <div class="video-grid">
                ${videos.slice(0,3).map(video => `
                    <a
                        href="${video.url}"
                        target="_blank"
                        class="video-card"
                    >
                        <img
                            src="${video.thumbnail}"
                            alt="${video.title}"
                        >

                        <h4>${video.title}</h4>
                    </a>
                `).join('')}
            </div>
        `;

    } catch (err) {
        console.error(err);
    }
}
    loadTutorial();
</script>

</body>
</html>
