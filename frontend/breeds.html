<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ras Kucing — PawTrainer</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .breed-modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(45, 24, 10, 0.5);
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .breed-modal-overlay.open { opacity: 1; pointer-events: all; }
        .breed-modal {
            background: var(--warm-white);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 560px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            transform: scale(0.95);
            transition: transform 0.2s ease;
            position: relative;
        }
        .breed-modal-overlay.open .breed-modal { transform: scale(1); }
        .breed-modal__close {
            position: absolute; top: 1rem; right: 1rem;
            font-size: 1.3rem; cursor: pointer; color: var(--text-muted);
            background: var(--sand); border: none; border-radius: 50%;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            transition: background var(--transition);
        }
        .breed-modal__close:hover { background: var(--tan); color: var(--dark-brown); }
        .breed-stat { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--sand); font-size: 0.875rem; }
        .breed-stat:last-child { border-bottom: none; }
        .breed-stat__label { color: var(--text-muted); font-weight: 500; }
        .breed-stat__val   { color: var(--text-primary); font-weight: 600; text-align: right; max-width: 60%; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="js/navbar.js"></script>
<script>renderNavbar('breeds');</script>

<main class="page">
    <div class="page__header">
        <h1 class="page__title">🐱 Breed Explorer</h1>
        <p class="page__subtitle" id="totalBreeds">Menjelajahi semua ras kucing dari seluruh dunia.</p>
    </div>

    <!-- Search -->
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;">
        <div class="search-bar" style="flex:1;min-width:200px;max-width:400px;">
            <span>🔍</span>
            <input type="text" id="searchBreed" placeholder="Cari nama ras...">
        </div>
        <select id="originFilter" style="padding:0.55rem 0.9rem;border:1.5px solid var(--sand);border-radius:var(--radius);background:var(--warm-white);font-family:var(--font-body);color:var(--text-secondary);font-size:0.9rem;cursor:pointer;">
            <option value="">Semua Asal</option>
        </select>
    </div>

    <div id="errorBanner" class="alert alert--error" style="display:none;"></div>
    <div id="breedCount" style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1rem;"></div>

    <div id="breedGrid" class="grid grid--auto-sm">
        ${[1,2,3,4,5,6].map(() => `
        <div class="skeleton-card" style="padding:1.25rem;">
            <div class="skeleton skeleton-line" style="height:20px;width:60%;margin-bottom:10px;"></div>
            <div class="skeleton skeleton-line" style="height:14px;width:40%;margin-bottom:16px;"></div>
            <div class="skeleton skeleton-line" style="height:14px;width:100%;margin-bottom:6px;"></div>
            <div class="skeleton skeleton-line" style="height:14px;width:85%;"></div>
        </div>`).join('')}
    </div>
</main>

<!-- Modal -->
<div class="breed-modal-overlay" id="breedModal" onclick="closeModal(event)">
    <div class="breed-modal">
        <button class="breed-modal__close" onclick="closeBreedModal()">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    let allBreeds = [];

    async function loadBreeds() {
        try {
            const res    = await ExternalAPI.getBreeds();
            const data   = res.data.data;
            allBreeds    = data?.breeds || [];
            const total  = data?.total || allBreeds.length;

            document.getElementById('totalBreeds').textContent =
                `Menjelajahi ${total} ras kucing dari seluruh dunia.`;

            // Build origin filter
            const origins = [...new Set(allBreeds.map(b => b.origin).filter(Boolean))].sort();
            const origSel = document.getElementById('originFilter');
            origins.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o; opt.textContent = o;
                origSel.appendChild(opt);
            });

            renderBreeds();
        } catch (err) {
            document.getElementById('breedGrid').innerHTML = '';
            const banner = document.getElementById('errorBanner');
            banner.textContent = '⚠️ ' + UI.parseError(err);
            banner.style.display = 'block';
        }
    }

    function renderBreeds() {
        const search = document.getElementById('searchBreed').value.toLowerCase();
        const origin = document.getElementById('originFilter').value;

        const filtered = allBreeds.filter(b => {
            const matchSearch = !search || b.name.toLowerCase().includes(search) ||
                (b.description || '').toLowerCase().includes(search);
            const matchOrigin = !origin || b.origin === origin;
            return matchSearch && matchOrigin;
        });

        document.getElementById('breedCount').textContent =
            `Menampilkan ${filtered.length} dari ${allBreeds.length} ras`;

        const grid = document.getElementById('breedGrid');

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-state__icon">🐾</div>
                    <div class="empty-state__title">Ras tidak ditemukan</div>
                    <p class="empty-state__text">Coba ubah kata kunci atau filter asal.</p>
                </div>`;
            return;
        }

        grid.innerHTML = filtered.map(b => {
            const temps = (b.temperament || '').split(',').slice(0, 3);
            return `
            <div class="breed-card" onclick="openBreedDetail(${JSON.stringify(b).replace(/"/g, '&quot;')})">
                <div class="breed-card__name">🐱 ${b.name}</div>
                <div class="breed-card__origin">📍 ${b.origin || '—'}</div>
                <p class="breed-card__desc">${b.description || '—'}</p>
                <div class="breed-card__tags">
                    ${temps.map(t => `<span class="breed-tag">${t.trim()}</span>`).join('')}
                    ${b.life_span ? `<span class="breed-tag">⏳ ${b.life_span} thn</span>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    function openBreedDetail(b) {
        const modal = document.getElementById('breedModal');
        document.getElementById('modalContent').innerHTML = `
            <h2 style="font-family:var(--font-display);color:var(--dark-brown);margin-bottom:0.25rem;">
                🐱 ${b.name}
            </h2>
            <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1.25rem;">
                📍 ${b.origin || '—'}
            </p>
            <p style="font-size:0.9rem;line-height:1.7;color:var(--text-secondary);margin-bottom:1.5rem;">
                ${b.description || '—'}
            </p>
            <div>
                <div class="breed-stat">
                    <span class="breed-stat__label">Temperamen</span>
                    <span class="breed-stat__val">${b.temperament || '—'}</span>
                </div>
                <div class="breed-stat">
                    <span class="breed-stat__label">Umur</span>
                    <span class="breed-stat__val">${b.life_span || '—'} tahun</span>
                </div>
                <div class="breed-stat">
                    <span class="breed-stat__label">Berat</span>
                    <span class="breed-stat__val">${b.weight_kg || '—'} kg</span>
                </div>
                <div class="breed-stat">
                    <span class="breed-stat__label">Asal</span>
                    <span class="breed-stat__val">${b.origin || '—'}</span>
                </div>
            </div>
            ${b.wikipedia ? `<a href="${b.wikipedia}" target="_blank" rel="noopener" class="btn btn--outline btn--sm" style="margin-top:1.25rem;">
                🔗 Baca di Wikipedia
            </a>` : ''}`;

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeBreedModal() {
        document.getElementById('breedModal').classList.remove('open');
        document.body.style.overflow = '';
    }

    function closeModal(event) {
        if (event.target === document.getElementById('breedModal')) closeBreedModal();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeBreedModal();
    });

    document.getElementById('searchBreed').addEventListener('input', renderBreeds);
    document.getElementById('originFilter').addEventListener('change', renderBreeds);

    loadBreeds();
</script>

</body>
</html>
