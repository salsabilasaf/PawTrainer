<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial — PawTrainer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="api.js"></script>
<script>Auth.requireAuth();</script>
<script src="navbar.js"></script>
<script>renderNavbar('tutorials');</script>

<main class="page">
    <div class="page__header" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
        <div>
            <h1 class="page__title">Tutorial</h1>
            <p class="page__subtitle">Temukan panduan melatih kucingmu dari para ahli.</p>
        </div>
        <button id="addTutorialBtn" class="btn btn--primary" style="display:none;">+ Tambah Tutorial</button>
    </div>

    <!-- Filter Bar -->
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;">
        <div class="search-bar" style="flex:1;min-width:200px;max-width:360px;">
            <span>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Cari tutorial...">
        </div>
        <select id="difficultyFilter" style="padding:0.55rem 0.9rem;border:1.5px solid var(--sand);border-radius:var(--radius);background:var(--warm-white);font-family:var(--font-body);color:var(--text-secondary);font-size:0.9rem;cursor:pointer;">
            <option value="">Semua Level</option>
            <option value="beginner">Pemula</option>
            <option value="intermediate">Menengah</option>
            <option value="advanced">Mahir</option>
        </select>
        <select id="categoryFilter" style="padding:0.55rem 0.9rem;border:1.5px solid var(--sand);border-radius:var(--radius);background:var(--warm-white);font-family:var(--font-body);color:var(--text-secondary);font-size:0.9rem;cursor:pointer;">
            <option value="">Semua Kategori</option>
        </select>
    </div>

    <div id="errorBanner" class="alert alert--error" style="display:none;"></div>

    <div id="tutorialGrid" class="grid grid--auto"></div>

    <div id="pagination" class="pagination"></div>
</main>

<!-- Modal Tambah Tutorial -->
<div id="addModal" class="modal">
    <div class="modal__content">
        <div class="modal__header">
            <h2 class="modal__title">Tambah Tutorial</h2>
            <button class="modal__close" onclick="closeModal('addModal')">&times;</button>
        </div>
        <div class="modal__body">
            <form id="addForm">
                <div class="form-group">
                    <label>Judul *</label>
                    <input type="text" id="addTitle" required>
                </div>
                <div class="form-group">
                    <label>Konten *</label>
                    <textarea id="addContent" required></textarea>
                </div>
                <div class="form-group">
                    <label>Level Kesulitan *</label>
                    <select id="addDifficulty" required>
                        <option value="">Pilih Level</option>
                        <option value="beginner">Pemula</option>
                        <option value="intermediate">Menengah</option>
                        <option value="advanced">Mahir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kategori *</label>
                    <select id="addCategory" required>
                        <option value="">Pilih Kategori</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Waktu Estimasi (menit) *</label>
                    <input type="number" id="addTime" required min="1">
                </div>
            </form>
        </div>
        <div class="modal__footer">
            <button class="btn btn--outline" onclick="closeModal('addModal')">Batal</button>
            <button class="btn btn--primary" id="submitAddBtn" onclick="submitAddTutorial()">Simpan</button>
        </div>
    </div>
</div>

<!-- Modal Edit Tutorial -->
<div id="editModal" class="modal">
    <div class="modal__content">
        <div class="modal__header">
            <h2 class="modal__title">Edit Tutorial</h2>
            <button class="modal__close" onclick="closeModal('editModal')">&times;</button>
        </div>
        <div class="modal__body">
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Judul *</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>Konten *</label>
                    <textarea id="editContent" required></textarea>
                </div>
                <div class="form-group">
                    <label>Level Kesulitan *</label>
                    <select id="editDifficulty" required>
                        <option value="">Pilih Level</option>
                        <option value="beginner">Pemula</option>
                        <option value="intermediate">Menengah</option>
                        <option value="advanced">Mahir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kategori *</label>
                    <select id="editCategory" required>
                        <option value="">Pilih Kategori</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Waktu Estimasi (menit) *</label>
                    <input type="number" id="editTime" required min="1">
                </div>
            </form>
        </div>
        <div class="modal__footer">
            <button class="btn btn--outline" onclick="closeModal('editModal')">Batal</button>
            <button class="btn btn--primary" id="submitEditBtn" onclick="submitEditTutorial()">Simpan</button>
        </div>
    </div>
</div>

<!-- Modal Delete Tutorial -->
<div id="deleteModal" class="modal">
    <div class="modal__content">
        <div class="modal__header">
            <h2 class="modal__title">Hapus Tutorial</h2>
            <button class="modal__close" onclick="closeModal('deleteModal')">&times;</button>
        </div>
        <div class="modal__body">
            <p style="color:var(--text-secondary);margin-bottom:1rem;">Apakah kamu yakin ingin menghapus tutorial ini? Tindakan ini tidak dapat dibatalkan.</p>
            <div style="background:var(--cream);padding:1rem;border-radius:var(--radius);border-left:3px solid var(--soft-red);">
                <strong id="deleteTutorialTitle"></strong>
            </div>
        </div>
        <div class="modal__footer">
            <input type="hidden" id="deleteId">
            <button class="btn btn--outline" onclick="closeModal('deleteModal')">Batal</button>
            <button class="btn btn--danger" id="submitDeleteBtn" onclick="submitDeleteTutorial()">Hapus</button>
        </div>
    </div>
</div>

<script>
const ICON_CLOCK   = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const ICON_COMMENT = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
const ICON_HEART   = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
const PLACEHOLDER  = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;

let breedImages = [];

function getYoutubeVideoId(url) {
    if (!url) return null;
    const match = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
    return match ? match[1] : null;
}

function getYoutubeThumbnail(url) {
    const id = getYoutubeVideoId(url);
    return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : null;
}

function isValidUrl(value) {
    if (!value) return false;
    try {
        const url = new URL(value.trim());
        return ['http:', 'https:'].includes(url.protocol);
    } catch {
        return false;
    }
}

function hashString(value) {
    return Array.from(String(value)).reduce((hash, char) => {
        return ((hash << 5) - hash) + char.charCodeAt(0);
    }, 0);
}

function getFallbackBreedImage(tutorial) {
    if (!breedImages.length) return null;
    const seed = hashString(tutorial.title || tutorial.id || 'fallback');
    const index = Math.abs(seed) % breedImages.length;
    return breedImages[index];
}

function getTutorialThumbnail(tutorial) {
    return tutorial.image_url
        || getYoutubeThumbnail(tutorial.youtube_url)
        || getFallbackBreedImage(tutorial)
        || null;
}

let currentPage = 1;
let allTutorials = [];
let pagination = {};

// ── Modal Functions ───────────────────────────────────────────
function openModal(modalId) {
    document.getElementById(modalId).classList.add('active');
}

function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
}

// Close modal when clicking outside
['addModal', 'editModal', 'deleteModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
        if (e.target.id === id) closeModal(id);
    });
});

// ── Check if user is admin ────────────────────────────────────
function isAdmin() {
    const user = Auth.getUser();
    return user?.role === 'admin';
}

// Show/hide add button based on role
if (isAdmin()) {
    document.getElementById('addTutorialBtn').style.display = 'inline-flex';
    document.getElementById('addTutorialBtn').addEventListener('click', () => {
        // Clear form
        document.getElementById('addForm').reset();
        openModal('addModal');
    });
}

// Create tutorial
async function submitAddTutorial() {
    const btn = document.getElementById('submitAddBtn');
    UI.setLoading(btn, true);
    
    try {
        const formData = {
            title: document.getElementById('addTitle').value,
            content: document.getElementById('addContent').value,
            difficulty: document.getElementById('addDifficulty').value,
            category_id: parseInt(document.getElementById('addCategory').value),
            estimated_time: parseInt(document.getElementById('addTime').value)
        };
        
        await TutorialAPI.create(formData);
        UI.showToast('Tutorial berhasil ditambahkan', 'success');
        closeModal('addModal');
        loadTutorials(1);
    } catch (err) {
        UI.showToast(UI.parseError(err), 'error');
    } finally {
        UI.setLoading(btn, false);
    }
}

// Open edit modal with tutorial data
async function openEditModal(tutorialId) {
    if (!isAdmin()) return;
    
    try {
        const res = await TutorialAPI.getById(tutorialId);
        const t = unwrapData(res).tutorial;

        if (!t) {
            throw new Error('Data tutorial tidak ditemukan.');
        }
        
        document.getElementById('editId').value = t.id || '';
        document.getElementById('editTitle').value = t.title || '';
        document.getElementById('editContent').value = t.content || '';
        document.getElementById('editDifficulty').value = t.difficulty || '';
        document.getElementById('editTime').value = t.estimated_time || '';
        document.getElementById('editCategory').value = t.category_id || '';
        
        openModal('editModal');
    } catch (err) {
        UI.showToast(UI.parseError(err), 'error');
    }
}

// Update tutorial
async function submitEditTutorial() {
    const btn = document.getElementById('submitEditBtn');
    UI.setLoading(btn, true);
    
    try {
        const id = document.getElementById('editId').value;

        const formData = {
            title: document.getElementById('editTitle').value,
            content: document.getElementById('editContent').value,
            difficulty: document.getElementById('editDifficulty').value,
            category_id: parseInt(document.getElementById('editCategory').value),
            estimated_time: parseInt(document.getElementById('editTime').value)
        };
        
        await TutorialAPI.update(id, formData);
        UI.showToast('Tutorial berhasil diperbarui', 'success');
        closeModal('editModal');
        loadTutorials(currentPage);
    } catch (err) {
        UI.showToast(UI.parseError(err), 'error');
    } finally {
        UI.setLoading(btn, false);
    }
}

// Open delete modal
function openDeleteModal(tutorialId, title) {
    if (!isAdmin()) return;
    document.getElementById('deleteId').value = tutorialId;
    document.getElementById('deleteTutorialTitle').textContent = title;
    openModal('deleteModal');
}

// Delete tutorial
async function submitDeleteTutorial() {
    const btn = document.getElementById('submitDeleteBtn');
    UI.setLoading(btn, true);
    
    try {
        const id = document.getElementById('deleteId').value;
        await TutorialAPI.delete(id);
        UI.showToast('Tutorial berhasil dihapus', 'success');
        closeModal('deleteModal');
        loadTutorials(1);
    } catch (err) {
        UI.showToast(UI.parseError(err), 'error');
    } finally {
        UI.setLoading(btn, false);
    }
}

(async () => {
    try {
        const res = await CategoryAPI.getAll();
        const cats = unwrapData(res).categories || [];
        
        // Populate addCategory
        const addSel = document.getElementById('categoryFilter');
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.name;
            addSel.appendChild(opt);
        });
        
        // Populate form categories
        ['addCategory', 'editCategory'].forEach(id => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">Pilih Kategori</option>';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                sel.appendChild(opt);
            });
        });
    } catch (_) {}
})();

async function loadBreedImages() {
    try {
        const res = await ExternalAPI.getBreeds();
        const breeds = unwrapData(res).breeds || [];
        breedImages = breeds
            .map(b => b.image_url)
            .filter(Boolean);
    } catch (_) {
        breedImages = [];
    }
}

async function loadTutorials(page = 1) {
    showSkeletons();
    document.getElementById('errorBanner').style.display = 'none';
    try {
        if (!breedImages.length) {
            await loadBreedImages();
        }

        const res  = await TutorialAPI.getAll(page);
        const data = unwrapData(res);
        allTutorials = data.tutorials || [];
        const params = new URLSearchParams(window.location.search);
        const categoryId = params.get('category_id');

        if (categoryId) {
            allTutorials = allTutorials.filter(
                t => t.category_id == categoryId
            );
        }
        pagination   = data.pagination || {};
        currentPage  = page;
        renderTutorials();
        renderPagination();
    } catch (err) {
        document.getElementById('tutorialGrid').innerHTML = '';
        const banner = document.getElementById('errorBanner');
        banner.textContent = UI.parseError(err);
        banner.style.display = 'block';
    }
}

function renderTutorials() {
    const search     = document.getElementById('searchInput').value.toLowerCase();
    const difficulty = document.getElementById('difficultyFilter').value;
    const category   = document.getElementById('categoryFilter').value;

    const filtered = allTutorials.filter(t => {
        const matchSearch = !search ||
            t.title.toLowerCase().includes(search) ||
            (t.content || '').toLowerCase().includes(search);
        const matchDiff = !difficulty || t.difficulty === difficulty;
        const matchCat  = !category  || String(t.category_id) === category;
        return matchSearch && matchDiff && matchCat;
    });

    const grid = document.getElementById('tutorialGrid');

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <div class="empty-state__icon">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <div class="empty-state__title">Tutorial tidak ditemukan</div>
                <p class="empty-state__text">Coba ubah filter atau kata kunci pencarianmu.</p>
            </div>`;
        return;
    }

    grid.innerHTML = filtered.map(t => {
        const thumb = getTutorialThumbnail(t);
        return `
        <article class="card" style="display:flex;flex-direction:column;">
            <div onclick="location.href='tutorial-detail.html?id=${t.id}'" style="cursor:pointer;flex:1;">
                <div style="position:relative;overflow:hidden;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);">
                    ${thumb ? `
                        <img class="card__img" src="${thumb}" alt="${t.title}" loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="card__img--placeholder" style="display:none;">
                            ${PLACEHOLDER}
                        </div>
                    ` : `
                        <div class="card__img--placeholder">
                            ${PLACEHOLDER}
                        </div>
                    `}
                </div>
                <div class="card__body">
                    <div class="card__meta">
                        ${UI.difficultyBadge(t.difficulty)}
                        <span class="meta-icon">${ICON_CLOCK} ${t.estimated_time} mnt</span>
                        <span>${t.category?.name || ''}</span>
                    </div>
                    <h3 class="card__title">${t.title}</h3>
                    <div class="card__footer">
                        <span class="meta-icon">${ICON_COMMENT} ${t.comments_count || 0} komentar</span>
                        <span class="meta-icon">${ICON_HEART} ${t.favorites_count || 0}</span>
                    </div>
                </div>
            </div>
            ${isAdmin() ? `
                <div style="display:flex;gap:0.5rem;padding:0.75rem 1.25rem;border-top:1px solid var(--sand);background:var(--cream);">
                    <button class="btn btn--sm" style="flex:1;background:var(--tan);color:white;" onclick="openEditModal(${t.id})">Edit</button>
                    <button class="btn btn--sm btn--danger" style="flex:1;" onclick="openDeleteModal(${t.id}, '${t.title.replace(/'/g, "\\'")}')">Hapus</button>
                </div>
            ` : ''}
        </article>`;
    }).join('');
}

function renderPagination() {
    const { current_page, last_page } = pagination;
    if (!last_page || last_page <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    let html = `<button class="pagination__btn" ${current_page <= 1 ? 'disabled' : ''} onclick="loadTutorials(${current_page - 1})">← Sebelumnya</button>`;
    for (let i = 1; i <= last_page; i++) {
        if (i === 1 || i === last_page || Math.abs(i - current_page) <= 1) {
            html += `<button class="pagination__btn ${i === current_page ? 'active' : ''}" onclick="loadTutorials(${i})">${i}</button>`;
        } else if (Math.abs(i - current_page) === 2) {
            html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
        }
    }
    html += `<button class="pagination__btn" ${current_page >= last_page ? 'disabled' : ''} onclick="loadTutorials(${current_page + 1})">Berikutnya →</button>`;
    document.getElementById('pagination').innerHTML = html;
}

function showSkeletons() {
    document.getElementById('tutorialGrid').innerHTML = [1,2,3,4,5,6].map(() => `
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%;margin-top:14px;"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
            <div class="skeleton skeleton-line" style="width:90%;margin-bottom:12px;"></div>
        </div>`).join('');
}

document.getElementById('searchInput').addEventListener('input', renderTutorials);
document.getElementById('difficultyFilter').addEventListener('change', renderTutorials);
document.getElementById('categoryFilter').addEventListener('change', renderTutorials);

loadTutorials(1);
</script>

</body>
</html>
