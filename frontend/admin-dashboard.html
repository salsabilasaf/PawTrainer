<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — PawTrainer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="api.js"></script>
<script>
    Auth.requireAuth();
    const _u = Auth.getUser();
    if (_u?.role !== 'admin') {
        window.location.replace('dashboard.html');
    }
</script>
<script src="navbar.js"></script>
<script>renderNavbar('dashboard');</script>

<main class="page">
    <div class="page__header">
        <div>
            <h1 class="page__title" id="greeting">Halo, Admin!</h1>
            <p class="page__subtitle">Kelola konten PawTrainer dari sini.</p>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <button class="btn btn--primary btn--sm" onclick="location.href='tutorials.html'">
                + Tambah Tutorial
            </button>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-card__value" id="statTutorials">—</div>
            <div class="stat-card__label">Total Tutorial</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__value" id="statCategories">—</div>
            <div class="stat-card__label">Kategori</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__value" id="statComments">—</div>
            <div class="stat-card__label">Total Komentar</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__value" id="statFavs">—</div>
            <div class="stat-card__label">Total Favorit</div>
        </div>
    </div>

    <div class="section-header">
        <h2>Tutorial Terbaru</h2>
        <a href="tutorials.html" class="btn btn--outline btn--sm">Kelola Semua</a>
    </div>

    <div id="tutorialsContainer" class="grid grid--auto">
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
    </div>

    <section class="activity-section">
    <div class="section-header">
        <h2>Aktivitas Terbaru</h2>
        <span id="activityCount"></span>
    </div>

    <div id="activityLog" class="activity-list">
        <p>Memuat aktivitas...</p>
    </div>
</section>

</main>

<script>
let breedImages = [];

async function loadDashboard() {
    const user = Auth.getUser();
    document.getElementById('greeting').textContent =
        `Halo, ${user?.name?.split(' ')[0] || 'Admin'}!`;

    resetSkeletons();

    try {
        await loadBreedImages();
    } catch (_) {}

    let tutorials = [];
    let totalTutorials = 0;
    let totalComments = 0;
    try {
        const res  = await TutorialAPI.getAll(1);
        const data = unwrapData(res);
        tutorials       = data.tutorials || [];
        totalTutorials  = data.pagination?.total || tutorials.length;

        totalComments = tutorials.reduce((sum, t) => sum + (t.comments_count || 0), 0);

        document.getElementById('statTutorials').textContent = totalTutorials;
        document.getElementById('statComments').textContent  = totalComments;

        renderTutorials(tutorials.slice(0, 6));
    } catch (err) {
        document.getElementById('statTutorials').textContent = '—';
        document.getElementById('statComments').textContent  = '—';
        document.getElementById('tutorialsContainer').innerHTML =
            `<div class="alert alert--error" style="grid-column:1/-1">
                Gagal memuat tutorial: ${UI.parseError(err)}
             </div>`;
        
    }

    try {
        const res  = await CategoryAPI.getAll();
        const cats = unwrapData(res).categories || [];
        document.getElementById('statCategories').textContent = cats.length;
        renderCategories(cats);
    } catch (_) {
        document.getElementById('statCategories').textContent = '—';
        document.getElementById('categoriesContainer').innerHTML =
            `<span style="color:var(--text-muted);font-size:0.9rem;">Gagal memuat kategori.</span>`;
    }

    try {
        const res  = await FavoriteAPI.getAll();
        const favs = unwrapData(res).favorites || [];
        document.getElementById('statFavs').textContent = favs.length;
    } catch (_) {
        document.getElementById('statFavs').textContent = '—';
    }
}

async function loadBreedImages() {
    try {
        const res = await ExternalAPI.getBreeds();
        const breeds = unwrapData(res).breeds || [];
        breedImages = breeds
            .map(b => b.image_url)
            .filter(Boolean);
    } catch (_) {
        breedImages = [];
    }
}

function hashString(value) {
    return Array.from(String(value)).reduce((hash, char) => {
        return ((hash << 5) - hash) + char.charCodeAt(0);
    }, 0);
}

function getFallbackBreedImage(tutorial) {
    if (!breedImages.length) return null;
    const seed = hashString(tutorial.title || tutorial.id || 'fallback');
    const index = Math.abs(seed) % breedImages.length;
    return breedImages[index];
}

function getTutorialThumbnail(tutorial) {
    return tutorial.image_url || getFallbackBreedImage(tutorial) || null;
}

function resetSkeletons() {
    document.getElementById('tutorialsContainer').innerHTML = `
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-line" style="width:80%"></div>
            <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>`;
}

function renderTutorials(tutorials) {
    const container = document.getElementById('tutorialsContainer');
    if (tutorials.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <div class="empty-state__icon">📝</div>
                <div class="empty-state__title">Belum ada tutorial</div>
                <p class="empty-state__text">Klik "Tambah Tutorial" untuk membuat tutorial pertama.</p>
            </div>`;
        return;
    }
    container.innerHTML = tutorials.map(t => {
        const thumb = getTutorialThumbnail(t);
        return `
        <article class="card" onclick="location.href='tutorial-detail.html?id=${t.id}'" style="cursor:pointer;">
            ${thumb
                ? `<img class="card__img" src="${thumb}" alt="${t.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <div class="card__img--placeholder" style="display:none">🐾</div>`
                : `<div class="card__img--placeholder">🐾</div>`}
            <div class="card__body">
                <div class="card__meta">
                    ${UI.difficultyBadge(t.difficulty)}
                    <span>${t.estimated_time} menit</span>
                    <span>${t.category?.name || ''}</span>
                </div>
                <h3 class="card__title">${t.title}</h3>
                <p class="card__excerpt">${t.content || ''}</p>
                <div class="card__footer">
                    <span>💬 ${t.comments_count || 0}</span>
                    <span>❤️ ${t.favorites_count || 0}</span>
                    <span>${UI.formatDate(t.created_at)}</span>
                </div>
            </div>
        </article>`;
    }).join('');
}


async function loadDashboardData() {
    const user = Auth.getUser();
    document.getElementById('greeting').textContent =
        `Halo, ${user?.name?.split(' ')[0] || 'Admin'}!`;

    resetSkeletons();

    try {
        await loadBreedImages();
    } catch (_) {}

    try {
        const res = await AdminAPI.getStats();
        const stats = unwrapData(res);
        document.getElementById('statTutorials').textContent = stats.total_tutorials ?? 0;
        document.getElementById('statCategories').textContent = stats.total_categories ?? 0;
        document.getElementById('statComments').textContent = stats.total_comments ?? 0;
        document.getElementById('statFavs').textContent = stats.total_favorites ?? 0;
    } catch (_) {
        ['statTutorials', 'statCategories', 'statComments', 'statFavs'].forEach(id => {
            document.getElementById(id).textContent = '-';
        });
    }

    try {
        const res = await TutorialAPI.getAll(1);
        const tutorials = unwrapData(res).tutorials || [];
        renderTutorials(tutorials.slice(0, 6));
    } catch (err) {
        document.getElementById('tutorialsContainer').innerHTML =
            `<div class="alert alert--error" style="grid-column:1/-1">Gagal memuat tutorial: ${UI.parseError(err)}</div>`;
    }

    try {
    const res = await AdminAPI.getActivityLog();
    const logs = unwrapData(res).logs || [];

    console.log(logs);
    renderAdminActivityLog(logs);
} catch (err) {
    console.error('Activity Log Error:', err);

    const logContainer = document.getElementById('activityLog');
    if (logContainer) {
        logContainer.innerHTML =
            '<div class="alert alert--error">Gagal memuat aktivitas.</div>';
    }
}

}

function renderAdminActivityLog(logs) {
    const container = document.getElementById('activityLog');

    if (logs.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state__title" style="font-size:1rem;">Belum ada aktivitas</div></div>`;
        document.getElementById('activityCount').textContent = '';
        return;
    }

    document.getElementById('activityCount').textContent = `${logs.length} entri terbaru`;
    container.innerHTML = logs.map(log => `
        <div style="
display:flex;
align-items:center;
gap:0.75rem;
padding:0.75rem 1rem;
background:#fff;
border:1px solid #e9e2d8;
border-radius:12px;
margin-bottom:0.75rem;
">
            <span style="
font-size:0.72rem;
font-weight:600;
padding:0.3rem 0.6rem;
background:#f5f5f5;
border-radius:999px;
color:#666;
text-transform:capitalize;
white-space:nowrap;
">
${log.type}
</span>
            <div style="flex:1;min-width:0;">
                <div style="
font-size:0.95rem;
font-weight:500;
color:#222;
line-height:1.4;
">${log.text}</div>
                <div style="
font-size:0.75rem;
color:#999;
margin-top:0.15rem;
">${UI.formatDate(log.created_at)}</div>
            </div>
        </div>`).join('');
}

loadDashboard = loadDashboardData;

loadDashboard();

setInterval(() => {
    loadDashboard();
}, 10000);
</script>

</body>
</html>
